[project]
name = "educational-platform"
version = "0.1.0"
description = "Educational platform for exam preparation (EGE)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.0",
    "split-settings>=0.3",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "black>=24.0",
    "flake8>=7.0",
    "responses>=0.25",
]
ugc = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "marshmallow>=3.22",
    "PyJWT>=2.9",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]
notifications = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
all = [
    "educational-platform[dev,ugc,notifications]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["django_app", "."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
testpaths = [
    "django_app/tests",
    "services/ugc/tests",
    "services/notifications/tests",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E501"]
