[project]
name = "educational-platform"
version = "0.1.0"
description = "Educational platform for exam preparation"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.0",
    "split-settings>=0.3",
    "requests>=2.32",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "black>=24.0",
    "flake8>=7.0",
    "responses>=0.25",
]
ugc = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "marshmallow>=3.22",
    "PyJWT>=2.9",
    "sqlalchemy>=2.0",
    "requests>=2.32",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["django_app", "."]
python_files = ["test_*.py"]
testpaths = ["django_app/tests", "services/ugc/tests"]